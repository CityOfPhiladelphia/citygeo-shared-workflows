name: Shellcheck

on:
  workflow_call:
    inputs:
      files:
        required: true
        type: string
      cli_opts:
        required: false
        type: string
        default: " "

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        name: Checkout source code
      - name: Install shellcheck
        run: sudo apt update && sudo apt install shellcheck
      - name: Run ShellCheck
        run: shellcheck ${{ inputs.cli_opts }} ${{ inputs.files }}
