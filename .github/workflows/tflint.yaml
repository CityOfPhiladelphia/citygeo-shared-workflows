name: TFLint

on:
  workflow_call:
    inputs:
      parent_tf_dir:
        required: true
        type: string
        description: Parent directory where all Terraform files are underneath
        default: "."
      cli_opts:
        required: false
        type: string
        default: " "

jobs:
  terraform_fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        name: Checkout source code

      - name: Calculate tflint config hash
        id: hash
        run: |
          echo "hash=$(sha256sum ${{ inputs.parent_tf_dir }}/.tflint.hcl | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        name: Cache plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: selfhosted-tflint-${{ steps.hash.outputs.hash }}

      - uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6
        name: Setup TFLint
        with:
          tflint_version: latest

      - name: Show version
        run: |
          cd ${{ inputs.parent_tf_dir }}
          tflint --version

      - name: Init TFLint
        run: |
          cd ${{ inputs.parent_tf_dir }}
          tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint recursively
        run: |
          cd ${{ inputs.parent_tf_dir }}
          tflint --recursive -f compact ${{ inputs.cli_opts }}
