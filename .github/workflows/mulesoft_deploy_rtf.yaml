---
name: Maven Deploy to Runtime Fabric
on:
  workflow_call:
    inputs:
      MS_ENV:
        required: true
        type: string
      extraEnv:
        required: false
        type: string
        default: "{}"
      secretsToEnv:
        required: false
        type: string
        default: ""
      connectedAppKeeperSecretId:
        description: Keeper Secret ID for the conncted app creds
        type: string
        default: "HGM2Arit4Ay4djbYppD3ww"
        required: false
      muleEEKeeperSecretId:
        description: Keeper Secret ID for the conncted app creds
        type: string
        default: "0QuKUfpty8Y8DvkebYqeuw"
        required: false

concurrency:
  group: deploy-rtf-${{ inputs.MS_ENV }}
  cancel-in-progress: false

jobs:
  deploy-rtf:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.MS_ENV }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get MuleSoft parameters
        id: msparams
        run: |
          # xml parser
          MS_ENV=${{ inputs.MS_ENV }}
          if [[ "$MS_ENV" == "TEST" ]]; then
            echo "MS_TARGET=eks-rtf-test" >> $GITHUB_OUTPUT
            echo "MS_RTF_URL=https://rtf-testing.phila.gov" >> $GITHUB_OUTPUT
          elif [[ "$MS_ENV" == "DEV" ]]; then
            echo "MS_TARGET=eks-rtf-dev" >> $GITHUB_OUTPUT
            echo "MS_RTF_URL=https://rtf-dev.phila.gov" >> $GITHUB_OUTPUT
          elif [[ "$MS_ENV" == "PROD" ]]; then
            echo "MS_TARGET=eks-rtf-prod" >> $GITHUB_OUTPUT
            echo "MS_RTF_URL=https://rtf-prod.phila.gov" >> $GITHUB_OUTPUT
          elif [[ "$MS_ENV" == "SECURE-DEV" ]]; then
            echo "MS_TARGET=rtf-secure-dev" >> $GITHUB_OUTPUT
            echo "MS_RTF_URL=https://rtf-dev.citygeo-secure.phila.city" >> $GITHUB_OUTPUT
          elif [[ "$MS_ENV" == "SECURE-TEST" ]]; then
            echo "MS_TARGET=rtf-secure-test" >> $GITHUB_OUTPUT
            echo "MS_RTF_URL=https://rtf-test.citygeo-secure.phila.city" >> $GITHUB_OUTPUT
          elif [[ "$MS_ENV" == "SECURE-PROD" ]]; then
            echo "MS_TARGET=rtf-secure-prod" >> $GITHUB_OUTPUT
            echo "MS_RTF_URL=https://rtf-prod.citygeo-secure.phila.city" >> $GITHUB_OUTPUT
          else
            echo "Invalid mulesoft env"
            exit 1
          fi

      # Disclaimer: AI-Generated code. This parses the extraEnv input as a JSON, does
      # some text processing, then outputs it to the env.
      - name: Establish extra env vars
        run: |
          # Safe process substitution prevents subshell issues
          while IFS=$'\t' read -r key value; do
            echo "Setting env var: ${key}=${value}"

            # Append directly to GITHUB_ENV
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < <(echo '${{ inputs.extraEnv }}' | jq -r 'to_entries[] | "\(.key)\t\(.value)"')

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "zulu"
          java-version: 17
          # cache: "maven"
          mvn-server-credentials: |
            Repository:EXCHANGE_USERNAME:EXCHANGE_PASSWORD
            MuleRepository:MULE_EE_USERNAME:MULE_EE_PASSWORD
          mvn-repositories: |
            MuleRepository:https://repository.mulesoft.org/nexus-ee/content/repositories/releases-ee/:true

      # Maven version 3.9+ is broken
      # https://trailhead.salesforce.com/trailblazer-community/feed/0D5KX00000jA1ye0AC
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.8.9

      - name: Show versions
        run: |
          java -version
          mvn -version

      # Disclaimer: AI-Generated code. This parses Github secrets a JSON, does
      # some text processing, masks the variable, then outputs it to the env.
      # I'm sure you can understand why I didn't want to write this by hand...
      - name: Add specified Github Actions secrets to env
        env:
          # Pass the entire inherited secrets context as a JSON string to Bash
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          KEYS_LIST="${{ inputs.secretsToEnv }}"

          # Loop through the requested keys using jq to pull from the full secrets JSON
          echo "$KEYS_LIST" | tr ',' '\n' | sed 's/ //g' | while read -r key; do
            # Skip empty lines
            [ -z "$key" ] && continue

            # Extract the specific secret value using jq
            value=$(echo "$ALL_SECRETS_JSON" | jq -r --arg k "$key" '.[$k]')

            # If the secret doesn't exist or is null, skip it
            if [ "$value" = "null" ] || [ -z "$value" ]; then
              echo "Warning: Secret '$key' not found in inherited secrets."
              continue
            fi

            # 1. Mask it just to be perfectly safe
            echo "::add-mask::$value"

            # 2. Append to GITHUB_ENV
            echo "Exporting $key to GITHUB_ENV..."
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Retrieve Credentials from Keeper
        id: ksecrets
        uses: Keeper-Security/ksm-action@310b9e6bd9d95e6fd49881e72c35a0a23cf5a0f0 # master
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}
          secrets: |-
            ${{ inputs.connectedAppKeeperSecretId }}/field/login > env:CONNECTED_APP_CLIENT_ID
            ${{ inputs.connectedAppKeeperSecretId }}/field/password > env:CONNECTED_APP_CLIENT_SECRET
            ${{ inputs.muleEEKeeperSecretId }}/field/login > env:MULE_EE_USERNAME
            ${{ inputs.muleEEKeeperSecretId}}/field/password > env:MULE_EE_PASSWORD

      - name: Deploy to RTF
        run: |
          mvn -B -ntp clean deploy -DskipTests -DmuleDeploy
        env:
          EXCHANGE_USERNAME: ~~~Client~~~
          EXCHANGE_PASSWORD: ${{ env.CONNECTED_APP_CLIENT_ID }}~?~${{ env.CONNECTED_APP_CLIENT_SECRET }}
          MULE_EE_USERNAME: ${{ env.MULE_EE_USERNAME }}
          MULE_EE_PASSWORD: ${{ env.MULE_EE_PASSWORD }}
          MS_ENV: ${{ inputs.MS_ENV }}
          MS_TARGET: ${{ steps.msparams.outputs.MS_TARGET }}
          MS_RTF_URL: ${{ steps.msparams.outputs.MS_RTF_URL }}
