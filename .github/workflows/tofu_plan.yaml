name: Terraform Plan

on:
  workflow_call:
    inputs:
      tf_dir:
        required: true
        type: string
        default: "."
      cli_opts:
        required: false
        type: string
        default: " "
    secrets:
      CITYGEO_AWS_ACCESS_KEY_ID:
        required: true
      CITYGEO_AWS_SECRET_ACCESS_KEY:
        required: true
      TF_KEEPER_KEY:
        required: true

jobs:
  terraform_plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        name: Checkout source code
      - name: Setup Tofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - name: Tofu Init
        run: |
          cd ${{ inputs.tf_dir }}
          tofu init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CITYGEO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CITYGEO_AWS_SECRET_ACCESS_KEY }}
      - name: Tofu Plan
        id: plan
        run: |
          cd ${{ inputs.tf_dir }}
          tofu plan -no-color -lock-timeout=300s -input=false ${{ inputs.cli_opts }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CITYGEO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CITYGEO_AWS_SECRET_ACCESS_KEY }}
          KEEPER_CREDENTIAL: ${{ secrets.TF_KEEPER_KEY }}
      - name: Write tofu plan output to pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
          TF_DIR: "${{ inputs.tf_dir }}"
          PLAN_OUTCOME: "${{ steps.plan.outcome }}"
          GITHUB_ACTOR: "${{ github.actor }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes(`Tofu plan output for \`${process.env.TF_DIR}\``);
            });

            const hasChanges = process.env.PLAN.indexOf("No changes. Your infrastructure matches the configuration.") >= 0 ? 'no' : 'yes'

            let processedPlan = process.env.PLAN;

            const tfModifyIndex = process.env.PLAN.indexOf("Tofu will perform the following actions:")
            if (tfModifyIndex >= 0) {
              processedPlan = process.env.PLAN.slice(tfModifyIndex)
            }

            const output = `### Tofu plan output for \`${process.env.TF_DIR}\`
            #### Contains changes: \`${hasChanges}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${processedPlan}
            \`\`\`

            </details>

            *Pusher: @${process.env.GITHUB_ACTOR}*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output,
              });
            }
