name: Tofu Apply

on:
  workflow_call:
    inputs:
      deploy_environment:
        type: string
        default: ""
      aws_access_key_id_keeper_path:
        required: true
        type: string
      aws_secret_access_key_keeper_path:
        required: true
        type: string
      terraform_keeper_key_keeper_path:
        type: string
        default: dSbGhN1_J1tqv-4dzrm8hw/field/password
      tf_dir:
        required: true
        type: string
        default: "."
      cli_opts:
        required: false
        type: string
        default: " "
    secrets:
      KSM_CONFIG:
        required: true

jobs:
  terraform_apply:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deploy_environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        name: Checkout source code
      - name: Retrieve secrets from Keeper
        id: ksecrets
        uses: Keeper-Security/ksm-action@37abbada28637b6478ba845e73d3f8b9676572fe # master
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}
          secrets: |-
            ${{ inputs.aws_access_key_id_keeper_path }} > env:AWS_ACCESS_KEY_ID
            ${{ inputs.aws_secret_access_key_keeper_path }} > env:AWS_SECRET_ACCESS_KEY
            ${{ inputs.terraform_keeper_key_keeper_path }} > env:TF_KEEPER_KEY
      - name: Setup Terraform
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2
      - name: Tofu Init
        run: |
          cd ${{ inputs.tf_dir }}
          tofu init
      - name: Tofu Apply
        run: |
          cd ${{ inputs.tf_dir }}
          tofu apply -auto-approve -lock-timeout=120s
        env:
          KEEPER_CREDENTIAL: ${{ env.TF_KEEPER_KEY }}
