name: Tofu Apply

on:
  workflow_call:
    inputs:
      deploy_environment:
        type: string
        default: ""
      tf_dir:
        required: true
        type: string
        default: "."
      cli_opts:
        required: false
        type: string
        default: " "
    secrets:
      KSM_CONFIG:
        required: true

jobs:
  terraform_apply:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deploy_environment }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        name: Checkout source code
      - name: Setup Terraform
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2
      - name: Tofu Init
        run: |
          cd ${{ inputs.tf_dir }}
          tofu init
      - name: Tofu Apply
        run: |
          cd ${{ inputs.tf_dir }}
          tofu apply -auto-approve -lock-timeout=120s -input=false ${{ inputs.cli_opts }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CITYGEO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CITYGEO_AWS_SECRET_ACCESS_KEY }}
          KEEPER_CREDENTIAL: ${{ secrets.TF_KEEPER_KEY }}
