---
name: Deploy docker image to variety EKS
on:
  workflow_call:
    inputs:
      deploy_env:
        required: true
        type: string
      app_folder:
        required: true
        type: string
        default: "{}"
      file_name:
        required: false
        type: string
        default: patch-deployment.yaml
      docker_tag:
        required: true
        type: string
        default: ""
      docker_hash:
        required: true
        type: string
        default: ""

jobs:
  deploy-eks:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.MS_ENV }}
    steps:
      - name: Verify app folder in allow list
        run: |
          TARGET="${{ inputs.app_folder }}"
          case "$TARGET" in
              "oit-api-wrapper"  | \
              "ais-autocomplete" | \
              "cherry" | \
              "orange")
                  echo "Match found!"
                  exit 1
                  ;;
              *)
                  exit 1
                  ;;
          esac
      - name: Generate a github token
        id: generate-gh-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CITYGEO_BOT_GH_APP_ID }}
          private-key: ${{ secrets.CITYGEO_BOT_GH_APP_PRIVATE_KEY }}
          owner: CityOfPhiladelphia

      - name: Checkout citygeo-variety-cluster-gitops
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: "CityOfPhiladelphia/citygeo-variety-cluster-gitops"
          token: ${{ steps.generate-gh-app-token.outputs.token }}
